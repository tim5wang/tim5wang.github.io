baseURL = 'https://tim5wang.github.io/'
locale = 'zh-cn'
title = "Tim's Blog"
theme = 'PaperMod'
defaultContentLanguage = 'zh-cn'

enableInlineShortcodes = true
enableRobotsTXT = true

[params]
  env = 'production'
  description = 'Personal blog about coding, AI, and tech'
  author = 'tim5wang'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  [params.homeInfoParams]
    Title = "👋 Hi, I'm tim5wang"
    Content = "Welcome to my blog! This is where I write about coding, AI tools, and tech experiments."

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/tim5wang'

  [[params.socialIcons]]
    name = 'csdn'
    url = 'https://blog.csdn.net/sinat_34820292'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:tim5wang@qq.com'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[taxonomies]
  tag = 'tags'
  category = 'categories'

[[menu.main]]
  identifier = 'home'
  name = 'Home'
  url = '/'
  weight = 1

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 2

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 3

[[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 4

[outputs]
  home = ['HTML', 'RSS', 'JSON']
